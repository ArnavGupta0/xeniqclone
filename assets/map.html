<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>3D Globe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; background-color: #000000; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; }
        
        /* Custom Marker Style */
        .provider-dot {
            width: 20px;
            height: 20px;
            background-color: #3B82F6;
            border-radius: 50%;
            box-shadow: 0 0 15px #3B82F6, 0 0 30px #3B82F6;
            animation: pulse 2s infinite;
            border: 2px solid #60A5FA;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Placeholder API Key - User must replace this
        const MAPTILER_KEY = 'get_your_own_OpIi9ZULNHZrESv6T2vL'; 

        const map = new maplibregl.Map({
            container: 'map',
            style: `https://api.maptiler.com/maps/hybrid/style.json?key=${MAPTILER_KEY}`,
            center: [77.0, 20.0],
            zoom: 1.5,
            projection: 'globe', // Enable 3D Globe
            pitch: 0,
            bearing: 0,
            antialias: true,
            interactive: true,
            attributionControl: false
        });

        // Atmosphere / Starry Background
        map.on('style.load', () => {
            map.setFog({
                'color': 'rgb(10, 10, 20)', // Lower atmosphere
                'high-color': 'rgb(0, 0, 0)', // Upper atmosphere
                'horizon-blend': 0.1, // Atmosphere thickness (default 0.2 at low zooms)
                'space-color': 'rgb(0, 0, 0)', // Background color
                'star-intensity': 0.6 // Background star brightness (default 0.35 at low zoooms )
            });
        });
        
        // Disable auto-rotation initially
        let userInteracting = false;
        
        map.on('mousedown', () => { userInteracting = true; });
        map.on('touchstart', () => { userInteracting = true; });
        map.on('mouseup', () => { userInteracting = false; });
        map.on('touchend', () => { userInteracting = false; });

        // Function to add provider markers from Flutter
        function updateProviders(providersJson) {
            try {
                const providers = JSON.parse(providersJson);
                
                // Remove existing markers (if any)
                const markers = document.getElementsByClassName('maplibregl-marker');
                while(markers[0]) {
                    markers[0].parentNode.removeChild(markers[0]);
                }

                providers.forEach(p => {
                    const el = document.createElement('div');
                    el.className = 'provider-dot';
                    
                    new maplibregl.Marker({ element: el })
                        .setLngLat([p.lng, p.lat])
                        .addTo(map);
                });
            } catch (e) {
                console.error("Error updating providers:", e);
            }
        }

        // Notify Flutter map is ready
        map.on('load', () => {
             // Optional: notify Flutter
             // window.flutter_inappwebview.callHandler('mapLoaded');
        });
    </script>
</body>
</html>
